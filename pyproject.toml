[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14,<4"
dependencies = [
    "fastapi[standard]>=0.142.2",
    "itsdangerous>=2.2.0",
    "pyjwt[crypto]>=2.15.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "loguru>=0.7.3",
    "rich>=15.0.0",
    "uvicorn[standard]>=0.54.0",
    "uvicorn-worker>=0.4.0",
    "gunicorn>=26.2.0",
    "sqladmin>=0.32.0",
    "alembic>=1.20.0",
    "sqlalchemy[asyncio]>=2.1.3",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-s"
asyncio_mode = "auto"
pythonpath = "."
testpaths = ["tests"]

[dependency-groups]
test = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.1"
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PT"]
ignore = [
    "F405",
    "RUF001", # ambiguous unicode in strings (Chinese punctuation is fine)
    "RUF002", # ambiguous unicode in docstrings
    "RUF003", # ambiguous unicode in comments
    "PT022",  # prefer uniform yield-style fixtures even without teardown
]

[tool.black]
line-length = 120
skip-string-normalization = true
