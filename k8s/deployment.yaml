apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: honey
  labels:
    app: backend
spec:
  replicas: 4
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: fastapi_demo:latest # 请替换为实际镜像地址，生产环境建议使用固定 tag
          args:
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            - "--workers"
            - "1"
          ports:
            - containerPort: 8000 # Matches uvicorn --port 8000.
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DB_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: SECRET_KEY
            - name: DEBUG
              value: "false"
          resources: # CPU/内存资源限制，requests 为调度基准，limits 为上限
            requests:
              cpu: "250m" # 0.25 核
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
